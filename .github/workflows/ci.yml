# The suite, the lint and the real-process tests, on every Python from the floor (3.10) to 3.13, the same matrix as CNS.
#
# The server tests start signet as its own process, talk to it over its Unix socket and kill it with SIGKILL, so
# what they prove is the separate program, not a function call. signet reads the caller's identity from the
# kernel (SO_PEERCRED), which is Linux only, so this runs on Linux and nowhere else is claimed.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    name: test (py${{ matrix.python }})
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: Tests (no skips; conftest.py fails the run on one)
        run: python -m pytest -q
      - name: Lint (ruff, rules named in pyproject.toml, version pinned in the dev extra)
        run: python -m ruff check .

  # The Rust client (rust/signet-client): its own tests, and its interop tests against the real signet started as its
  # own process. Those need signet installed, so Python comes first. A missing Python fails the run; nothing skips.
  rust-client:
    runs-on: ubuntu-latest
    name: rust client
    defaults:
      run:
        working-directory: rust/signet-client
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip && pip install -e ../..
      - run: rustup component add clippy rustfmt
      - name: Tests (the stand-in server and the real signet)
        run: cargo test --locked
        env:
          SIGNET_PYTHON: python
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo fmt --check

  # The separation itself, not just the wiring: signet under its own Linux account, the caller under another, and an
  # intruder under a third (tools/two_accounts.py). Every other test runs both sides as one account.
  separate-accounts:
    runs-on: ubuntu-latest
    name: separate accounts
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      # Not editable: signet's own account must be able to read the installed package.
      - run: python -m pip install --upgrade pip && pip install .
      - run: python tools/two_accounts.py
      # deploy/signet.service, as shipped, under systemd, with the accounts and config the step above made.
      - run: sudo python3 -m pip install --break-system-packages .
      - name: Run signet from its systemd unit and sign through it
        run: |
          sudo install -m 0644 deploy/signet.service /etc/systemd/system/signet.service
          sudo systemctl daemon-reload
          sudo systemctl start signet
          for i in $(seq 1 20); do [ -S /run/signet/signet.sock ] && break; sleep 0.5; done
          systemctl is-active signet
          python -c "import pwd; from signet.client import request; s, q = request('/run/signet/signet.sock', 'zeta-lock-result', b'zeta-lock-result-signature/1\nvia systemd', expected_uid=pwd.getpwnam('signet').pw_uid); print('signed through the unit, log line', q)"
          sudo -u signet python3 -m signet status --config /etc/signet/config.json
          sudo systemctl stop signet
          sudo journalctl -u signet --no-pager | tail -5
