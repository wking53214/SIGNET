[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "signet"
version = "0.1.0"
description = "The keyholder for the library: a separate signer program, a signed key registry and a tamper-evident signature log."
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "William N. King" }]
# Ed25519 through a maintained library (OpenSSL underneath). Nothing else.
dependencies = ["cryptography>=42"]

[project.optional-dependencies]
# The interop tests plug signet into the real zeta, beta and delta at the commits the CNS spine manifest names.
# They are tools for the tests, not dependencies of signet: nothing in the package imports them.
dev = [
    "pytest>=7",
    "hypothesis>=6.100",
    "ruff==0.17.2",
    "zeta @ git+https://github.com/wking53214/interconnected_zeta@3ab587ac157e78394bb0fdc646ec9948ea9bb6ee",
    "beta @ git+https://github.com/wking53214/interconnected_beta@af994334724692fd1cb1736fbf6496819e2f8511",
    "delta @ git+https://github.com/wking53214/interconnected_delta@a8f4ffc477cd33405ad92239e2d255c52e6b9b0d",
]

[project.scripts]
signet = "signet.__main__:main"

[tool.setuptools.packages.find]
# signet_anchor is portable on purpose: when it moves to its own repository, remove it here (docs/OUTSIDE_ANCHOR_v1.md).
include = ["signet", "signet.*", "signet_anchor", "signet_anchor.*"]

[tool.ruff]
extend-exclude = ["build"]

[tool.ruff.lint]
# pyflakes, and the import, statement and syntax-error checks of pycodestyle. Named, not left to ruff's default.
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
